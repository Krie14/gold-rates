name: Update prices

on:
  schedule:
    # Every day at 00:17 UTC, after the New York close.
    - cron: "17 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch today's prices
        run: node scripts/update-prices.mjs
        env:
          DIAMOND_FEED_URL: ${{ secrets.DIAMOND_FEED_URL }}
          DIAMOND_FEED_TOKEN: ${{ secrets.DIAMOND_FEED_TOKEN }}

      - name: Commit updated data
        run: |
          if git diff --quiet -- data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
